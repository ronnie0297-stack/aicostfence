name: Feature request
description: Suggest an SDK, provider, check, or workflow improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New AI SDK or provider
        - Cost calculation
        - Pull-request report
        - Policy or team workflow
        - Setup and documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a useful result look like?
    validations:
      required: true

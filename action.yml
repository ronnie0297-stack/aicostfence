name: AICostFence
description: Block AI SDK changes that can create runaway model costs.
author: AICostFence
branding:
  icon: shield
  color: green
inputs:
  path:
    description: Directory to scan.
    required: false
    default: .
  config:
    description: Path to the AICostFence JSON configuration.
    required: false
    default: .aicostfence.json
  comment:
    description: Post or update a report comment on pull requests.
    required: false
    default: "true"
  baseline-path:
    description: Optional separate directory containing the baseline source checkout. Uses current config for both scans.
    required: false
outputs:
  comparison-complete:
    description: Whether all detected calls on both sides could be priced.
  monthly-cost-delta:
    description: Current minus baseline estimated monthly USD, or unknown when pricing is incomplete.
  status:
    description: pass, warn, or fail
  estimated-monthly-cost:
    description: Estimated monthly cost in USD across detected call sites.
  findings:
    description: Number of findings.
runs:
  using: node20
  main: src/index.js
